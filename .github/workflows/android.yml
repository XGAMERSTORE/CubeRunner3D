name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install required Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;33.0.2" "platforms;android-33" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17"
          EOF
      - name: Resolve SDK and JDK paths
        run: |
          sed -i "s|/usr/local/lib/android/sdk|$ANDROID_HOME|g" "$HOME/.config/godot/editor_settings-4.tres"
          sed -i "s|/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17|$JAVA_HOME|g" "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Diagnose Android export configuration
        run: |
          cat > /tmp/check_export.gd <<'EOF'
          extends SceneTree
          func _initialize():
              print("SDK=", EditorInterface.get_editor_settings().get_setting("export/android/android_sdk_path"))
              print("JAVA=", EditorInterface.get_editor_settings().get_setting("export/android/java_sdk_path"))
              print("KEY=", EditorInterface.get_editor_settings().get_setting("export/android/debug_keystore"))
              quit()
          EOF
          godot --headless --editor --path . --script /tmp/check_export.gd || true
          ls -la "$ANDROID_HOME/build-tools/33.0.2" | head
          ls -la "$HOME/.local/share/godot/export_templates/4.2.2.stable" | head
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
          ls -l "$HOME/.android/debug.keystore"
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/CubeRunner3D.apk
          test -s build/CubeRunner3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRunner3D-APK
          path: build/CubeRunner3D.apk
          if-no-files-found: error

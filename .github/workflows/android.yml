name: Build CubeRunner3D APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android SDK and signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build /root/.local/share/godot/export_templates
          echo "ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}" >> "$GITHUB_ENV"
          if [ ! -f /root/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk ]; then
            find / -path '*/4.2.2.stable/android_debug.apk' -print 2>/dev/null | head -5
          fi
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import and validate
        run: godot --headless --editor --path . --quit
      - name: Export debug APK
        run: |
          set -eux
          godot --headless --path . --export-debug Android build/CubeRunner3D.apk
          test -s build/CubeRunner3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeRunner3D-APK
          path: build/CubeRunner3D.apk
          if-no-files-found: error

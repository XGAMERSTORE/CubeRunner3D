name: Build CubeRunner3D APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable 2>/dev/null || true
          mkdir -p build
      - name: Import and validate project
        run: godot --headless --editor --path . --quit
      - name: Build APK
        run: |
          godot --headless --path . --export-debug Android build/CubeRunner3D.apk
          test -s build/CubeRunner3D.apk
          file build/CubeRunner3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeRunner3D-APK
          path: build/CubeRunner3D.apk
          if-no-files-found: error

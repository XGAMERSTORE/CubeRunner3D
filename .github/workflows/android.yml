name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android
        run: |
          godot --headless --editor --quit --path .
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          printf '\nexport/android/android_sdk_path = "/usr/local/lib/android/sdk"\nexport/android/debug_keystore = "/home/runner/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' >> "$SETTINGS"
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/CubeRunner3D.apk
          test -s build/CubeRunner3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CubeRunner3D-APK
          path: build/CubeRunner3D.apk
          if-no-files-found: error
